[package]
name = "jalb"
description = "A simple, configurable TCP proxy and load balancer for backend services"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nakajimayoshi/jalb"
readme = "README.md"
keywords = ["load-balancer", "proxy", "tcp", "networking"]
categories = ["network-programming"]

# `jalb` is both a library (for embedding in other Rust projects) and a small
# CLI binary that runs the load balancer from a TOML config file.
[lib]
name = "jalb"
path = "src/lib.rs"

[[bin]]
name = "jalb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
geo = { version = "0.30.0", features = ["serde", "use-serde"] }
http = "1.3.1"
isocountry = "0.3.2"
log = { version = "0.4.27", features = ["serde"] }
ordered-float = { version = "5.0.0", features = ["serde", "speedy"] }
reqwest = "0.12.15"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
toml = "0.8.22"
url = { version = "2.5.4", features = ["serde"] }
