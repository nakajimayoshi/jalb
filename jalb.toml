version = "1"

[loadbalancer]
type = "network"                    # "network" or "application"
strategy = "round_robin"           # round_robin, least_used, weighted_average, geo
listener_address = "127.0.0.1"
port = 6331
max_connections = 1000
max_requests_per_connection = 100

[logging]
log_level = "info"                 # debug, info, warn, error
rotate_logs = true
log_capacity_mb = 10
path = "./log.txt"

[security]
ip_whitelist = []
ip_blacklist = []

[backend]
name = "auth service"
health_endpoint = "/healthz"
health_check_interval_seconds = 30
health_check_timeout_seconds = 5
failed_request_threshold = 5
request_timeout_seconds = 5
rate_limit = 400
peers = [
    { address = "127.0.0.1:4000", weight = 1, coordinates = { x = 35.3, y = 135.3 } },
    { address = "127.0.0.1:4001", weight = 1, coordinates = { x = 35.4, y = 135.4 } },
    { address = "127.0.0.1:4002", weight = 1, coordinates = { x = 35.3, y = 135.3 } },
    { address = "127.0.0.1:4003", weight = 1, coordinates = { x = 35.4, y = 135.4 } },
]
